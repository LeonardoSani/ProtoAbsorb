[project]
name = "proto-absorb"
version = "0.1.0"
description = "Prototype Absorption: OOD Detection Degradation under Test-Time Adaptation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "ProtoAbsorb Authors" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "umap-learn>=0.5.5",
    "pandas>=2.1",
    "requests>=2.31",
    "timm>=1.0.26",
]

[project.optional-dependencies]
cuda = []  # install torch from a CUDA index manually if needed
tent-replication = [
    "robustbench>=1.1,<2",
    "yacs>=0.1.8",
    "pyautoattack>=0.2,<1",
    "iopath>=0.1.9",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
proto-train = "proto_absorb.cli:train_main"
proto-centroids = "proto_absorb.cli:centroids_main"
# Reframed protocol (canonical, see doc/reframe.md)
proto-step1 = "proto_absorb.cli:step1_main"
proto-step2 = "proto_absorb.cli:step2_main"
proto-step3 = "proto_absorb.cli:step3_main"
proto-step4 = "proto_absorb.cli:step4_main"
proto-step5 = "proto_absorb.cli:step5_main"
proto-step6 = "proto_absorb.cli:step6_main"
proto-train-vit = "proto_absorb.cli:train_vit_main"
proto-vit-backbone = "proto_absorb.cli:vit_backbone_main"
# Legacy prototype-absorption framing (kept for reproducibility)
proto-exp1 = "proto_absorb.cli:exp1_main"
proto-exp2 = "proto_absorb.cli:exp2_main"
proto-exp3 = "proto_absorb.cli:exp3_main"
proto-exp7 = "proto_absorb.cli:exp7_main"

[tool.uv]
environments = ["sys_platform == 'linux'"]
# Workaround: robustbench 1.1.x pins `timm==1.0.9` exactly, but this project
# requires `timm>=1.0.26`. The override relaxes robustbench's pin to `>=1.0.9`
# so uv resolves the already-required 1.0.26. See `src/autoattack/__init__.py`
# for the companion autoattack→pyautoattack shim that addresses robustbench's
# bare `import autoattack` against PyPI's `pyautoattack` namespace.
override-dependencies = [
    "timm>=1.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_absorb", "src/models", "src/data", "src/utils", "experiments", "src/autoattack"]
